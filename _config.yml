title: Matías Zabaljáuregui
tagline: IA agéntica, seguridad de agentes y docencia
description: Escritos sobre arquitectura, seguridad y evaluación de agentes de IA.
url: "https://matiaszabal.github.io"
baseurl: ""
lang: es
timezone: America/Argentina/Buenos_Aires

author:
  name: Matías Zabaljáuregui

social:
  github: matiaszabal
  substack: https://matiaszz.substack.com

plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /escritos/:title/

# Los posts con fecha futura NO se publican hasta que llegue su fecha
# (el workflow reconstruye el sitio todos los días).
future: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - _drafts
