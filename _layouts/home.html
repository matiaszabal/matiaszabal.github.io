---
layout: default
---
<section class="intro">
  <h1>{{ site.tagline }}</h1>
  <p>{{ site.description }}</p>
</section>

<ol class="post-list">
  {%- for post in site.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{% include fecha.html date=post.date %}</time>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    {%- if post.description and post.description != "" %}
    <p>{{ post.description }}</p>
    {%- endif %}
  </li>
  {%- endfor %}
</ol>
